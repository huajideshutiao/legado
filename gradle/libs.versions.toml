[versions]
# ===== 构建工具链 =====
agp = "8.13.2"
kotlin = "2.3.20"
# KSP2 与 Kotlin 版本解耦; 2.2.21-2.0.4 的 KSP1 在 KMP expect/actual 上会抛
# "Unexpected symbol type null", 必须用 2.3.x 的 KSP2。
ksp = "2.3.11"
desugar = "2.1.5"

# ===== Compose Multiplatform (Android/桌面共用基线) =====
cmp = "1.11.1"
# 必须与 cmp 基线匹配: 0.41.0 起对 CMP 1.10 编译, 在 1.9.2 上运行时 NoSuchMethodError
# 0.43.0 含 inlineCode 字号/TextUnit 崩溃修复与同步 parseMarkdown API
# (注: 0.43.0 按 CMP 1.10 编译; 升 CMP 1.11 后若运行时 NoSuchMethodError 需同步升级 mikepenz 版本)
# 0.43.0/0.42.0 的 iosArm64 klib 由 Kotlin 2.4.0 编译 (abi_version=2.4.0), 项目 Kotlin 2.3.20
# 只能消费 abi<=2.3.0; 暂钉 0.41.0 (Kotlin 2.3.21 编译, abi 2.3.0 兼容), 升 Kotlin 2.4.x 后回 0.43.0。
multiplatformMarkdown = "0.41.0"
# 桌面视频播放引擎: open-ani/mediamp (Compose Multiplatform 播放抽象, 替代自研 libmpv 直通渲染)。
# 0.3.0 于 2026-08-09 发布 (基于 CMP 1.11 基线), 与 CMP 1.11.1 + Kotlin 2.3.20 匹配。
mediamp = "0.3.0"
# 必须与 cmp 基线匹配 (CMP 1.11.x ↔ JetBrains lifecycle 2.10.0;
# CMP 1.10.x ↔ 2.9.4)。Android target 不再单独钉 androidx foundation:
# CMP 1.11.1 的安卓映射即 androidx foundation 1.11.2 (含 1.11 的 ActionMode
# SelectionContainer 复制后闪"仅全选"过渡帧修复), 桌面/安卓同基线。
lifecycleMultiplatform = "2.10.0"

# ===== 鸿蒙 (CPF fork) 专属版本 =====
# 默认工具链跟随 Android/iOS/JVM 依赖的 KLIB ABI; OHOS 通过 enableOhosTarget
# 在 settings/build-logic 中单独切到 CPF Kotlin 2.2.21-0.4.0。
kotlin-ohos = "2.2.21-0.5.0-12"
composeMultiplatform-ohos = "1.9.2-0.5.0-25"
# CPF ohos 配套库版本 (2026-08: 0.5.0 仅发布 kotlin/compose/androidx 主体,
# 其余配套库仍为 0.4.0 基线; 升级统一改此处, 禁止在构建脚本硬编码)
coroutines-ohos = "1.10.2-0.4.0"
atomicfu-ohos = "0.31.0-0.4.0"
okio-ohos = "3.16.4-0.4.0"
serialization-ohos = "1.9.1-0.4.0"
ktor-ohos = "3.3.3-0.3.0"
androidx-ohos = "2.9.4-0.5.0-25"
room-ohos = "3.0.0-alpha01-0.3.0"
stately-ohos = "2.1.0-0.4.0"

# ===== JetBrains 官方库 (kotlinx) =====
coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
atomicfu = "0.33.0"
slf4jNop = "2.0.18"

# ===== AndroidX / Google 官方库 =====
core = "1.18.0"
appcompat = "1.7.1"
activity = "1.13.0"
fragment = "1.8.9"
lifecycle = "2.10.0"
media = "1.8.0"
media3 = "1.10.1"
webkit = "1.16.0"
documentfile = "1.1.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
sqlite = "2.7.0"
room = "3.0.1"
collection = "1.6.0"
material = "1.14.0"
libarchive = "1.1.6"
playServicesCronet = "18.1.1"
# Android Baseline Profile: 生成器 (benchmark 模块) 与 profileinstaller 必须同源版本族
macrobenchmark = "1.4.1"
profileinstaller = "1.4.1"
testJunit = "1.3.0"
testRunner = "1.7.0"
espresso = "3.7.0"
uiautomator = "2.4.0"

# ===== 网络栈 =====
okhttp = "5.4.0"
okio = "3.18.1"
ktor = "3.5.2"
cronet = "143.7445.0"
coil3 = "3.3.0"

# ===== HTML / XML / SVG 解析 =====
ksoup = "0.2.6"
kxml2 = "2.3.0"
jsvg = "2.1.0"
androidsvg = "1.4"

# ===== 压缩 / 文档格式 =====
commonsCompress = "1.28.0"
junrar = "8.1.0"
xz = "1.12"
pdfbox = "3.0.8"

# ===== JS 引擎 / 加密 / 简繁转换 =====
rhino = "1.9.1"
hutool = "5.8.22"
# 桌面端 JVM 用: SunJCE 无 PKCS7Padding, 书源 java.createSymmetricCrypto('AES/CBC/PKCS7Padding')
# 在桌面端报 "Cannot find any provider supporting AES/CBC/PKCS7Padding"; bcprov (Oracle 签名,
# 通过 JCE provider 认证) 补齐 PKCS7Padding/SM4/RC4 等算法。版本与本地 gradle 缓存一致。
# ⚠️ 2026-08-15 起已禁用 (desktop/build.gradle.kts 有完整教训注释): BC 类一旦进运行时
# classpath, hutool SecureUtil 会经 GlobalBouncyCastleProvider 用 BC 的 RSA Cipher,
# 触发分段加密 → 网易云 weapi 全部 200 空体。如需 PKCS7Padding 请走 PKCS7→PKCS5 字节级
# 等价替换 (SymmetricCryptoAndroid.normalizePkcs7Padding), 不要再加回 bcprov。
bouncycastle = "1.79"
quickChineseTransfer = "0.2.16"

# ===== 嵌入式服务 / JSON =====
nanoHttpd = "2.3.1"
json = "20260814"

# ===== 桌面 JVM 专属 =====
jna = "5.19.1"

# ===== UI 组件 =====
reorderable = "3.1.0"

# ===== 测试 =====
junit = "4.13.2"

[libraries]
# ===== 构建工具链 =====
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "cmp" }
jetbrains-material = { module = "org.jetbrains.compose.material:material", version.ref = "cmp" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
# KSP 处理器模块 (quickjs-processor) 直接字符串引用 symbol-processing-api, 无需 catalog 条目
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }

# ===== Compose Multiplatform / UI =====
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-lifecycle-runtime-multiplatform = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
multiplatformMarkdown = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "multiplatformMarkdown" }
multiplatformMarkdown-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "multiplatformMarkdown" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# ===== 桌面视频 (mediamp-mpv, KMP 自动选 desktop 变体) =====
mediamp-mpv = { module = "org.openani.mediamp:mediamp-mpv", version.ref = "mediamp" }
# mpv native runtime: 不随 mediamp-mpv 传递, 需显式 runtimeOnly。聚合工件 (mediamp-mpv-runtime)
# 是单一 JVM variant, 依赖全部平台 runtime jar; desktop 已按构建平台改用下方 per-platform
# 工件 (见 desktop/build.gradle.kts), 聚合工件仅作未知平台兜底。运行时 loader 按当前 OS/arch
# 解包加载 (mpv-natives-<os>-<arch>.txt)。
mediamp-mpv-runtime = { module = "org.openani.mediamp:mediamp-mpv-runtime", version.ref = "mediamp" }
# 单平台 runtime 工件 (desktop 按构建平台固定一个: win/linux=x64, mac=arm64)
mediamp-mpv-runtime-windows-x64 = { module = "org.openani.mediamp:mediamp-mpv-runtime-windows-x64", version.ref = "mediamp" }
mediamp-mpv-runtime-linux-x64 = { module = "org.openani.mediamp:mediamp-mpv-runtime-linux-x64", version.ref = "mediamp" }
mediamp-mpv-runtime-macos-arm64 = { module = "org.openani.mediamp:mediamp-mpv-runtime-macos-arm64", version.ref = "mediamp" }

# ===== JetBrains 官方库 (kotlinx) =====
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
jetbrains-kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "cmp" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4jNop" }

# ===== AndroidX / Google 官方库 =====
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
appcompat-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
media-media = { module = "androidx.media:media", version.ref = "media" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
room-common = { module = "androidx.room3:room3-common", version.ref = "room" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "collection" }
libarchive = { module = "me.zhanghai.android.libarchive:library", version.ref = "libarchive" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "macrobenchmark" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
