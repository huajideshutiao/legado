[versions]

cronet = "143.7445.0"
# CPF-KMP-CMP 0.4.0 配套 Kotlin，提供正式 ohosArm64()/ohosX64() target。
kotlin = "2.2.21-0.4.0"
composeMultiplatform = "1.9.2-0.4.0"
krypto = "4.0.10"
ksoup = "0.2.6"
# KSP 2.x 独立版本号；沿用当前稳定处理器版本。
ksp = "2.3.7"
#agp影响范围太大，暂不升级
#noinspection AndroidGradlePluginVersion
agp = "8.13.2"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core = "1.18.0"
flexbox = "3.0.0"
fragment = "1.8.9"
documentfile = "1.1.0"

libarchive = "1.1.6"
glide = "5.0.7"
jsonPath = "3.0.0"
# CPF-KMP-CMP 0.4.0 配套的鸿蒙 KMP 生态制品。
kotlinxSerializationJson = "1.9.1-0.4.0"
coroutines = "1.10.2-0.4.0"
# KJ3 并发原语下沉：仅用 locks 门面(synchronized/SynchronizedObject)，纯库无需 gradle 插件
atomicfu = "0.31.0-0.4.0"
kotlinxDatetime = "0.7.1-0.4.0"
# 融合渲染由 CPF Compose 插件自动选择 skiko-ohosarm64-fusionrenderer 变体；
# 此 root 坐标保留给 desktop 与直接使用 org.jetbrains.skia 的共享实现。
skiko = "0.9.22.2-0.4.0"
# 作者已声明项目暂停维护（最后发布 2021），但 Android 平台无同等功能的活跃替代品
markwon = "4.6.2"
# 锁定 0.41.0：0.42.0+ 起 AAR 强制 compileSdk 37（kotlin-stdlib 2.4.0），AGP 8.13.2 上限 36
multiplatformMarkdown = "0.41.0"
material = "1.14.0"
media = "1.8.0"
# 出于轻量化考虑，不改用ktor
nanoHttpd = "2.3.1"
okhttp = "5.3.2"
# CPF 适配版 Okio 同时覆盖标准平台与 ohosArm64 变体。
okio = "3.16.4-0.4.0"
quickChineseTransfer = "0.2.16"
playServicesCronet = "18.1.1"

splitties = "3.0.0"
desugar = "2.1.5"

swiperefreshlayout = "1.2.0"
collection = "1.6.0"

#不要更新版本，新版本用了org.bouncycastle.**
#noinspection NewerVersionAvailable
hutool = "5.8.22"

protobufJavalite = "4.35.0"
jsoup = "1.22.2"
rhino = "1.9.1"
quickjsKt = "1.0.5"
media3 = "1.10.1"
webkit = "1.16.0"
activity = "1.13.0"
# Android Foundation 1.11 修复新 TextContextMenuProvider 下 SelectionContainer 复制后未及时释放选区，
# 避免平台 ActionMode 在关闭前重算成仅“全选”的过渡帧；仅 Android target 使用。
composeFoundationAndroid = "1.11.4"
lifecycle = "2.10.0"
room = "2.8.4"
# KMP Room 2.8.x 配套: sqlite-bundled 2.7.0 提供 BundledSQLiteDriver (跨平台 SQLite)
# 见 https://developer.android.com/kotlin/multiplatform/room
sqlite = "2.7.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
annotation = "1.10.0"
espresso = "3.7.0"
testJunit = "1.3.0"
testRunner = "1.7.0"
# 上游 2017 年后基本无更新，但仍是 Android 平台唯一成熟的运行时 SVG 渲染器（VectorDrawable 需编译期转换，不适用）
androidsvg = "1.4"
# 桌面端 MP3 解码（javax.sound.sampled 默认不支持 MP3 SPI），jlayer 是 Java 平台 MP3 解码事实标准
# 上游 2010 年后停止维护，但纯 Java 实现、无 native 依赖、API 稳定，仍是最轻量选择
jlayer = "1.0.1"
junit = "4.13.2"
# Coil3 官方版本
coil3 = "3.3.0"
# 拖拽排序：KMP 原生库(Maven Central，经 Aliyun central 镜像可达)，替代 ItemTouchHelper。3.x 用 animateItem API，需 compose≥1.7(BOM 已满足)
reorderable = "3.1.0"

[libraries]

multiplatformMarkdown = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "multiplatformMarkdown" }
multiplatformMarkdown-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "multiplatformMarkdown" }
multiplatformMarkdown-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "multiplatformMarkdown" }

# Skiko root 坐标；鸿蒙融合渲染变体由 CPF Compose 插件按 rendererBackend 选择。
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
compose-multiplatform-export = { module = "org.jetbrains.compose.export:export", version.ref = "composeMultiplatform" }

activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
cronet-api = { module = "org.chromium.net:cronet-api", version.ref = "cronet" }
cronet-embedded = { module = "org.chromium.net:cronet-embedded", version.ref = "cronet" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragment" }

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

