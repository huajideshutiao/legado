androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }

flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

material = { module = "com.google.android.material:material", version.ref = "material" }

mozilla-rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
quickjs-kt-android = { module = "io.github.dokar3:quickjs-kt-android", version.ref = "quickjsKt" }
# quickjs-kt KMP variant (JVM target 自带 .dll/.so/.dylib): 桌面端 JS 引擎用, Android 端继续用 quickjs-kt-android
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjsKt" }

# Android 平台 Compose 集成层；Compose 核心 runtime/foundation/material/ui 统一由
# Compose Multiplatform 插件的 compose.* 访问器提供，避免 app/shared 两套依赖体系。
# Coil3 KMP 图片加载 (替代 Glide, 适配 Compose + 跨端)
# artifact 名校验 (search.maven.org g:io.coil-kt.coil3): coil-compose / coil-network-okhttp 均 3.2.0
# coil3-core 原写法 io.coil-kt.coil3:coil3 不存在 (Maven 404), 正确聚合 artifact 为 io.coil-kt.coil3:coil
# 变体覆盖: coil-compose 发 iosArm64 (klib) 可放 sharedUiMain; coil-network-okhttp 仅 jvm/android (无 iosArm64/linuxArm64), 必须放 jvmAndAndroidMain
# coil-network-ktor3 发 iosArm64/iosSimulatorArm64 klib (repo1.maven.org 已核), pom 依赖 ktor-client-core 3.1.0 与项目 ktor 版本一致, 放 iosMain 专属
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil3" }
coil3-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
coil3-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
coil3-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-foundation-android = { module = "androidx.compose.foundation:foundation", version.ref = "composeFoundationAndroid" }
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

[bundles]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
androidTest = ["androidx-espresso-core", "androidx-junit", "androidx-runner"]

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# 桌面端入口模块（验证 KMP shared jvm target）
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# CPF-KMP-CMP 0.4.0 Compose 插件，负责 OHOS target、导出与融合渲染变体选择。
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
