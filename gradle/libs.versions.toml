[versions]
cronet = "143.7445.0"
# 默认工具链跟随 Android/iOS/JVM 依赖的 KLIB ABI；OHOS 通过 enableOhosTarget
# 在 settings/build-logic 中单独切到 CPF Kotlin 2.2.21-0.4.0。
kotlin = "2.3.20"
composeMultiplatform = "1.9.2"
composeMultiplatformOfficial = "1.9.2"
# 鸿蒙专用的版本通过 gradle.properties 或命令行参数开启强制替换
kotlin-ohos = "2.2.21-0.4.0"
composeMultiplatform-ohos = "1.9.2-0.4.0"

krypto = "4.0.10"
ksoup = "0.2.6"
# KSP2 与 Kotlin 版本解耦; 2.2.21-2.0.4 的 KSP1 在 KMP expect/actual 上会抛
# "Unexpected symbol type null", 必须用 2.3.x 的 KSP2。
ksp = "2.3.7"
agp = "8.13.2"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core = "1.18.0"
fragment = "1.8.9"
documentfile = "1.1.0"
libarchive = "1.1.6"
kotlinxSerializationJson = "1.11.0"
coroutines = "1.11.0"
atomicfu = "0.33.0"
# 必须与 composeMultiplatform 基线匹配, 独立追新会编译通过但运行时崩
skiko = "0.8.12"
# 必须与 composeMultiplatform 基线匹配: 0.41.0 起对 CMP 1.10 编译, 在 1.9.2 上运行时 NoSuchMethodError
multiplatformMarkdown = "0.40.0"
material = "1.14.0"
media = "1.8.0"
nanoHttpd = "2.3.1"
okhttp = "5.3.2"
okio = "3.18.1"
quickChineseTransfer = "0.2.16"
playServicesCronet = "18.1.1"
splitties = "3.0.0"
desugar = "2.1.5"
collection = "1.6.0"
hutool = "5.8.22"
rhino = "1.9.1"
media3 = "1.10.1"
webkit = "1.16.0"
activity = "1.13.0"
composeFoundationAndroid = "1.11.4"
lifecycle = "2.10.0"
# 必须与 composeMultiplatform 基线匹配 (CMP 1.9.x ↔ JetBrains lifecycle 2.9.4)
lifecycleMultiplatform = "2.9.4"
room = "3.0.1"
sqlite = "2.7.0"
recyclerview = "1.4.0"
annotation = "1.10.0"
espresso = "3.7.0"
testJunit = "1.3.0"
testRunner = "1.7.0"
androidsvg = "1.4"
jlayer = "1.0.1"
junit = "4.13.2"
coil3 = "3.3.0"
reorderable = "3.1.0"

[libraries]
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
multiplatformMarkdown = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "multiplatformMarkdown" }
multiplatformMarkdown-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "multiplatformMarkdown" }
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }
compose-multiplatform-export = { module = "org.jetbrains.compose.export:export", version.ref = "composeMultiplatform" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
cronet-api = { module = "org.chromium.net:cronet-api", version.ref = "cronet" }
cronet-embedded = { module = "org.chromium.net:cronet-embedded", version.ref = "cronet" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragment" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "collection" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
appcompat-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
krypto = { module = "com.soywiz.korlibs.krypto:krypto", version.ref = "krypto" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
play-services-cronet = { module = "com.google.android.gms:play-services-cronet", version.ref = "playServicesCronet" }
hutool-crypto = { module = "cn.hutool:hutool-crypto", version.ref = "hutool" }
libarchive = { module = "me.zhanghai.android.libarchive:library", version.ref = "libarchive" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
media-media = { module = "androidx.media:media", version.ref = "media" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
nanohttpd-nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanoHttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanoHttpd" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
quick-chinese-transfer-core = { module = "com.github.liuyueyi.quick-chinese-transfer:quick-transfer-core", version.ref = "quickChineseTransfer" }
room-common = { module = "androidx.room3:room3-common", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
jlayer = { module = "javazoom:jlayer", version.ref = "jlayer" }
splitties-appctx = { module = "com.louiscad.splitties:splitties-appctx", version.ref = "splitties" }
splitties-systemservices = { module = "com.louiscad.splitties:splitties-systemservices", version.ref = "splitties" }
splitties-views = { module = "com.louiscad.splitties:splitties-views", version.ref = "splitties" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
androidx-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mozilla-rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil3" }
coil3-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
coil3-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
coil3-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-foundation-android = { module = "androidx.compose.foundation:foundation", version.ref = "composeFoundationAndroid" }
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-lifecycle-runtime-multiplatform = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

[bundles]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
androidTest = ["androidx-espresso-core", "androidx-junit", "androidx-runner"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
