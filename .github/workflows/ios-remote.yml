name: iOS Remote

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: '会话保持时长(小时)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']

concurrency:
  group: ios-remote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-vnc-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Download & Install App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 防 console 锁屏: 锁屏需随机密码解锁, VNC 无法进入; console 登录用户为 Anka 虚拟化账户, 两者都写
          for U in anka Anka runner; do
            if id "$U" >/dev/null 2>&1; then
              sudo -u "$U" defaults -currentHost write com.apple.screensaver idleTime -int 0
              sudo -u "$U" defaults -currentHost write com.apple.screensaver askForPassword -int 0
            fi
          done
          sudo systemsetup -setcomputersleep Never -setdisplaysleep Never
          nohup caffeinate -dimsu >/dev/null 2>&1 &
          ASSET="$(gh release view multiplatform-test --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(endswith("-ios-simulator.zip"))] | sort | last // empty')"
          if [ -z "$ASSET" ]; then
            echo "::error::multiplatform-test 没有找到模拟器资产"
            exit 1
          fi
          rm -rf /tmp/simapp && mkdir -p /tmp/simapp/x
          gh release download multiplatform-test --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/simapp
          unzip -q "/tmp/simapp/$ASSET" -d /tmp/simapp/x
          APP="$(find /tmp/simapp/x -name '*.app' | head -1)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          UDID="$(xcrun simctl list devices 'iOS' available | grep -m1 'iPhone' | awk -F '[()]' '{print $2}')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

      - name: Enable Screen Sharing
        run: |
          # macos-26 镜像未给屏幕共享服务录屏/事件注入/辅助功能授权, 致 VNC 黑屏且无法操作; 按 actions/runner-images#9529 实证运行时写入系统 TCC.db
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for C in "'com.apple.screensharing.agent',0" "'/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent',1"; do
            for S in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access VALUES('$S',$C,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1708076718,NULL,NULL,'UNUSED',1708076718);"
            done
          done
          sudo sqlite3 "$DB" "SELECT service,client,auth_value FROM access WHERE client LIKE '%screensharing%' OR client LIKE '%ARDAgent%';"
          sudo killall tccd
          # 兜底: ARD 认证走系统账号, 新建用户设初始密码无需旧密码 (fastmac configure.sh 验证做法)
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 1001
          sudo dscl . -create /Users/vncuser PrimaryGroupID 80
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "12345678"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "12345678" \
            -restart -agent -console

      # 隧道守护与保活合一: cloudflared 崩溃自动重启, 新域名实时打到本步骤日志(网页实时可见)
      - name: Start noVNC, Tunnel & Keep Alive
        run: |
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          # 强制纯 VNC 密码认证: 新版 noVNC 按服务器偏好会优先选 ARD 系统账号认证
          sed -i '' '/securityTypeARD,/d' /tmp/noVNC/core/rfb.js
          nohup /tmp/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 >/dev/null 2>&1 &
          brew install cloudflared
          END=$(( $(date +%s) + ${{ github.event.inputs.duration_hours }} * 3600 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
              for i in $(seq 1 30); do
                URL="$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)"
                [ -n "$URL" ] && break
                sleep 1
              done
              # 密码不入 URL: GitHub 对 password= 参数打码致复制失效; resize=scale 根治画面不缩放
              [ -n "$URL" ] && echo "直连网址: $URL/vnc.html?autoconnect=true&resize=scale (VNC 密码 12345678)"
            fi
            sleep 20
          done
