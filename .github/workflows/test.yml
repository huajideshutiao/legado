name: Test Build

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
      # - '!**/assets/**'
      # - '!**.md'
      - '!**/ISSUE_TEMPLATE/**'
      - '!**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_run:
    workflows: [Build Web]
    branches: [ '**' ]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限; 需要写 Release/tag 的 job 单独提权 (见 build.permissions)
permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionL: ${{ steps.set-ver.outputs.versionL }}
      lanzou: ${{ steps.check.outputs.lanzou }}
      telegram: ${{ steps.check.outputs.telegram }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H%M)" >> $GITHUB_OUTPUT
          echo "versionL=$(date -d "8 hour" -u +3.%y.%m%d%H%M)" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if [ "${{ secrets.LANZOU_ID }}" ]; then
            echo "lanzou=yes" >> $GITHUB_OUTPUT
          fi
          if [ "${{ secrets.BOT_TOKEN }}" ]; then
            echo "telegram=yes" >> $GITHUB_OUTPUT
          fi

  # ===== 单元测试 + shared/desktop 编译校验 (与 build 并行, 快速反馈) =====
  # 此前 workflow 名为 "Test Build" 却从不跑任何测试; app/src/test 与
  # shared/src/jvmAndAndroidTest 下 30+ 个测试类长期无人执行, 故补此 job。
  # 不作为 build 的前置依赖: 测试挂了立刻红叉可见, 但不阻塞 beta 产物发布。
  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile shared (jvm) & desktop
        # 本机常跑的两条验证线; app 侧编译由 build job 的 assemble 覆盖
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileKotlinJvm :desktop:compileKotlin --build-cache --parallel --daemon --warning-mode all
      - name: Run unit tests (shared jvm + app)
        # :shared:jvmTest 覆盖 jvmAndAndroidTest 源集; :app:testAppDebugUnitTest 覆盖 app 侧 (flavor=app)
        run: ./gradlew :shared:jvmTest :app:testAppDebugUnitTest --build-cache --parallel --daemon --warning-mode all
      - name: Upload test reports
        # 失败时最需要报告, 故 always()
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ github.workspace }}/shared/build/reports/tests/
            ${{ github.workspace }}/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: prepare
    runs-on: ubuntu-latest
    # 本 job 要删除/发布 beta Release, 必须显式提权 (仓库默认 token 可能只读)
    permissions:
      contents: write
    env:
      product: app
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Release Apk Sign
        # ⚠️ 安全提示: 签名库 .github/workflows/legado.jks 直接提交在仓库里, 且口令
        # (gedoor_legado) 明文硬编码在下方 sed 中 —— 任何人 clone 即可签出「看起来官方」的包。
        # 这是上游 gedoor/legado 的历史做法, 本 fork 沿用。beta 测试包用它尚可接受,
        # 但不应与 release.yml 的正式签名 (走 RELEASE_KEY_STORE secret) 混用。
        # 建议 (需用户拍板, 未擅自改动): 改为 secrets 注入, 或明确它只是「公开测试密钥」。
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          sed '$a\RELEASE_STORE_FILE=./legado.jks'          $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_ALIAS=legado'                 $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_STORE_PASSWORD=gedoor_legado'     $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_PASSWORD=gedoor_legado'       $GITHUB_WORKSPACE/gradle.properties -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release (原包名)
        run: |
          echo "统一版本号"
          # app/build.gradle 已迁移为 build.gradle.kts, 锚定 kts 声明行 val version = "3.${releaseTime()}"
          sed "/^val version = /c val version = \"${{ env.VERSIONL }}\"" $GITHUB_WORKSPACE/app/build.gradle.kts  -i
          echo "开始${{ env.product }}原包名构建"
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all
          echo "收集APK"
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }}/app/build/outputs/apk -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;
          echo "移动mapping文件"
          mkdir -p ${{ github.workspace }}/mapping/
          for file in `ls ${{ github.workspace }}/app/build/outputs/mapping/*/mapping.txt 2>/dev/null`; do
            mv "$file" ${{ github.workspace }}/mapping/mapping.txt
          done
          for file in `ls ${{ github.workspace }}/app/build/outputs/mapping/*/missing_rules.txt 2>/dev/null`; do
            mv "$file" ${{ github.workspace }}/mapping/missing_rules.txt
          done

      - name: Upload (原包名) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.product }}.原包名
          path: |
            ${{ github.workspace }}/apk/*.apk
            ${{ github.workspace }}/mapping/mapping.txt
            ${{ github.workspace }}/mapping/missing_rules.txt
          if-no-files-found: ignore

      - name: Release Note & Tag
        if: github.event_name != 'pull_request'
        run: |
          echo "## 更新日志" > RELEASE_NOTES.md
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "⚠️ **注意：当前分支为 ${{ github.ref_name }}，包含实验性功能，可能有破坏性变更。**" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi
          if [ "${{ github.event_name }}" == "push" ]; then
            git log ${{ github.event.before }}..${{ github.event.after }} --pretty=format:"- %<(72,trunc)%s (%h)" | head -20 >> RELEASE_NOTES.md
          else
            git log -10 --pretty=format:"- %<(72,trunc)%s (%h)" >> RELEASE_NOTES.md
          fi

      - name: Upload (原包名) To Lanzou
        if: github.event_name != 'pull_request' && needs.prepare.outputs.lanzou == 'yes'
        continue-on-error: true
        run: |
          python3 .github/scripts/lzy_web.py "${{ github.workspace }}/apk/" "${{ secrets.LANZOU_FOLDER_ID }}"
        env:
          ylogin: ${{ secrets.LANZOU_ID }}
          phpdisk_info: ${{ secrets.LANZOU_PSD }}

      - name: Post (原包名) to Telegram
        if: github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes'
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHANNEL_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          context: |
            #阅读 #Legado #Beta ${{ env.VERSIONL }} (原包名)
            ${{ github.ref_name != 'master' && format('⚠️ 实验性分支: {0}', github.ref_name) || '' }}
          path: apk/*.apk
          method: sendFile

      # --- 接着编译共存版 ---
      - name: Build ReleaseA (共存)
        run: |
          echo "修改applicationIdSuffix为共存版"
          # kts 双引号赋值; 精确锚整句, 避免误伤 if (applicationIdSuffix == ".releaseA") 判断行与 ".debug" 赋值
          sed 's|applicationIdSuffix = ".release"|applicationIdSuffix = ".releaseA"|' $GITHUB_WORKSPACE/app/build.gradle.kts  -i
          echo "开始${{ env.product }}共存构建"
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all
          echo "收集共存版APK"
          find ${{ github.workspace }}/app/build/outputs/apk -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      - name: Upload (共存) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.product }}.共存
          path: ${{ github.workspace }}/apk/*releaseA*.apk

      # 两个变体都构建完成后再一次性发布，避免「更新已有资产」路径触发 already_exists
      - name: Delete Old Beta Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: gh release delete beta -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Pre-Release (原包名 + 共存)
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: "beta"
          bodyFile: RELEASE_NOTES.md
          prerelease: true
          allowUpdates: true
          artifacts: ${{ github.workspace }}/apk/*.apk

      - name: Upload (共存) To Lanzou
        if: github.event_name != 'pull_request' && needs.prepare.outputs.lanzou == 'yes'
        continue-on-error: true
        run: |
          # 只上传共存版
          mkdir -p apk_coexist/
          cp apk/*releaseA*.apk apk_coexist/
          python3 .github/scripts/lzy_web.py "${{ github.workspace }}/apk_coexist/" "${{ secrets.LANZOU_FOLDER_ID }}"
        env:
          ylogin: ${{ secrets.LANZOU_ID }}
          phpdisk_info: ${{ secrets.LANZOU_PSD }}

      - name: Post (共存) to Telegram
        if: github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes'
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHANNEL_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          context: |
            #阅读 #Legado #Beta ${{ env.VERSIONL }} (共存)
            ${{ github.ref_name != 'master' && format('⚠️ 实验性分支: {0}', github.ref_name) || '' }}
          path: apk/*releaseA*.apk
          method: sendFile

  # ===== 多端桌面产物 (与 Android build 并行) =====
  # Windows MSI: Windows runner 上 jpackage 调 WiX 打包
  desktop-build:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unify Desktop packageVersion
        shell: bash
        run: |
          # MSI 要求 x.y.z[.w] 格式; VERSION 形如 3.25.07221530 (4 段) 满足
          sed "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts -i
      - name: Build Quickjs Native Lib (Windows .dll)
        # desktop 打包前需要 quickjs native 库 (liblegado_quickjs.dll) 落到 jvm/native 目录
        # Windows runner 自带 cmake + MSVC, 一般可成功; 失败时 continue-on-error, 让上层打包报错更明确
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Build MSI
        run: ./gradlew :desktop:packageMsi --build-cache --parallel --daemon --warning-mode all
      - name: Collect MSI
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/msi/
          find ${{ github.workspace }}/desktop/build/compose/binaries/msi -name "*.msi" -exec mv {} ${{ github.workspace }}/msi/ \;
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop.msi
          path: ${{ github.workspace }}/msi/*.msi
          if-no-files-found: ignore
      # Windows 便携版 zip: 复用 createDistributable 产物 (MSI 上游), 仅打 zip 不经安装器
      - name: Build portable zip
        # packagePortableZip 仅 Windows 执行 (onlyIf), 依赖 createDistributable, 与 MSI 共享 app image
        run: ./gradlew :desktop:packagePortableZip --build-cache --parallel --daemon --warning-mode all
      - name: Collect portable zip
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/portable/
          find ${{ github.workspace }}/desktop/build/outputs/portable -name "legado-portable-windows-x64-*.zip" -exec mv {} ${{ github.workspace }}/portable/ \;
      - name: Upload portable zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-portable-windows-x64
          path: ${{ github.workspace }}/portable/*.zip
          if-no-files-found: ignore
          retention-days: 30

  # Linux DEB/RPM: Ubuntu runner 上 jpackage 调 dpkg-deb / rpmbuild
  linux-build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Linux packaging deps
        # jpackage 打 deb 需要 dpkg-deb, 打 rpm 需要 rpmbuild; ubuntu-latest 默认无 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
      - name: Unify Desktop packageVersion
        run: |
          sed "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts -i
      - name: Build Quickjs Native Lib (Linux .so)
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Build DEB & RPM
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm --build-cache --parallel --daemon --warning-mode all
      - name: Collect Linux packages
        run: |
          mkdir -p ${{ github.workspace }}/linux/
          find ${{ github.workspace }}/desktop/build/compose/binaries -name "*.deb" -exec mv {} ${{ github.workspace }}/linux/ \;
          find ${{ github.workspace }}/desktop/build/compose/binaries -name "*.rpm" -exec mv {} ${{ github.workspace }}/linux/ \;
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop.linux
          path: |
            ${{ github.workspace }}/linux/*.deb
            ${{ github.workspace }}/linux/*.rpm
          if-no-files-found: ignore

  # ===== macOS DMG (与 Android build 并行) =====
  # macOS DMG: macOS runner 上 jpackage 打包
  # iOS 编译/出包已迁出到独立的 .github/workflows/ios.yml (仅 workflow_dispatch 手动触发):
  # macOS runner 计费是 Linux 的 10 倍, iOS 链路不适合每次 push 都跑。
  macos-build:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unify Desktop packageVersion
        # macOS 自带 BSD sed, -i 需要空字符串备份后缀 (与 GNU sed 语法不同)
        run: |
          sed -i '' "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts
      - name: Build Quickjs Native Lib (macOS .dylib)
        # desktop 打包前需要 quickjs native 库 (liblegado_quickjs.dylib) 落到 jvm/native 目录
        # macos-latest 自带 cmake + clang, 一般可成功; 失败时 continue-on-error, 让上层打包报错更明确
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Build macOS DMG
        run: ./gradlew :desktop:packageDmg --build-cache --parallel --daemon --warning-mode all
      - name: Collect DMG
        run: |
          mkdir -p ${{ github.workspace }}/dmg/
          find ${{ github.workspace }}/desktop/build/compose/binaries/dmg -name "*.dmg" -exec mv {} ${{ github.workspace }}/dmg/ \;
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop.dmg
          path: ${{ github.workspace }}/dmg/*.dmg
          if-no-files-found: ignore

  # ===== 鸿蒙 .so (debug) =====
  # 已移除 (2026-08): CPF 工具链构件仅发布在 maven.eazytec-cloud.com (中国私有 Nexus),
  # GitHub-hosted runner 无法访问, 该 job 必然失败。
  # .so 改本地构建: ./gradlew :shared:linkDebugSharedOhosArm64 -PenableOhosTarget=true
  # 产物 shared/build/bin/ohosArm64/debugShared/liblegado_shared.so,
  # 供鸿蒙 DevEco Studio 本地打包 HAP 时链接。

  # ===== 鸿蒙 HAP 构建说明 (CI 上无法运行, 仅本地) =====
  # 原因: 鸿蒙 DevEco Studio / hvigor / HarmonyOS SDK (API 12+) 无官方公开 Docker 镜像,
  #        GitHub-hosted runner 不预装, 需自托管 runner 或私有 action 注入 SDK, 故 CI 不构建 HAP.
  #        test.yml 的 .so 编译 job 也已移除 (eazytec 私有源 GitHub runner 不可达), 见上方说明.
  #        本地构建 .so: ./gradlew :shared:linkDebugSharedOhosArm64 -PenableOhosTarget=true
  #
  # 用户本地构建 HAP 步骤:
  #   1. 安装 DevEco Studio: https://developer.huawei.com/consumer/cn/deveco-studio/
  #   2. 通过 DevEco Studio SDK Manager 安装 HarmonyOS SDK (API 12+, 即 compatibleSdkVersion 5.0.0(12))
  #   3. 配置签名 (二选一):
  #      a) 调试签名: DevEco Studio 自动生成临时调试证书, 直接 Build → Build Hap(s)/APP(s) 即可
  #      b) 发布签名: 在 ohosApp/build-profile.json5 的 signingConfigs 数组填入 material.storeFile/cert
  #   4. 命令行打包 (在项目根 ohosApp/ 目录下):
  #        # Windows: hvigorw.bat / Linux/macOS: ./hvigorw
  #        node ./hvigorw assembleHap --mode module -p product=default --no-daemon
  #   5. 产物路径:
  #      - 未签名: ohosApp/entry/build/default/outputs/default/entry-default-unsigned.hap
  #      - 已签名: ohosApp/entry/build/default/outputs/default/entry-default-signed.hap
  #
  # 如未来 CI 想跑 HAP, 取消下面 ohos-hap 注释, 并在自托管 runner 上预装 HOS_SDK_HOME 与签名材料.
  #
  # ohos-hap:
  #   needs: prepare
  #   runs-on: [self-hosted, harmonyos]   # 需自托管 runner, 预装 DevEco 命令行工具
  #   env:
  #     HOS_SDK_HOME: ${{ secrets.HOS_SDK_HOME }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build HAP
  #       working-directory: ohosApp/
  #       run: node ./hvigorw assembleHap --mode module -p product=default --no-daemon
  #     - name: Upload HAP Artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: ohos.hap
  #         path: ohosApp/entry/build/default/outputs/default/*.hap
