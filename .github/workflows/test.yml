name: Test Build

on:
  push:
    branches:
      - '**'
    # 文档/资源类变更不触发完整 beta 构建发布
    paths-ignore:
      - '**.md'
      - '**/assets/**'
      - '**/ISSUE_TEMPLATE/**'
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/assets/**'
      - '**/ISSUE_TEMPLATE/**'
      - '**/modules/web/**'
  workflow_run:
    workflows: [Build Web]
    branches: [ '**' ]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限; 需要写 Release/tag 的 job 单独提权 (见 build.permissions)
permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      lanzou: ${{ steps.check.outputs.lanzou }}
      telegram: ${{ steps.check.outputs.telegram }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H%M)" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if [ "${{ secrets.LANZOU_ID }}" ]; then
            echo "lanzou=yes" >> $GITHUB_OUTPUT
          fi
          if [ "${{ secrets.BOT_TOKEN }}" ]; then
            echo "telegram=yes" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    # 发布已移入 publish-release job, 本 job 只需只读权限 (默认)
    env:
      product: app
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Release Apk Sign
        # ⚠️ 安全提示: 签名库 .github/workflows/legado.jks 直接提交在仓库里, 且口令
        # (gedoor_legado) 明文硬编码在下方 sed 中 —— 任何人 clone 即可签出「看起来官方」的包。
        # 这是上游 gedoor/legado 的历史做法, 本 fork 沿用。beta 测试包用它尚可接受,
        # 但不应与 release.yml 的正式签名 (走 RELEASE_KEY_STORE secret) 混用。
        # 建议 (需用户拍板, 未擅自改动): 改为 secrets 注入, 或明确它只是「公开测试密钥」。
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          sed '$a\RELEASE_STORE_FILE=./legado.jks'          $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_ALIAS=legado'                 $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_STORE_PASSWORD=gedoor_legado'     $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_PASSWORD=gedoor_legado'       $GITHUB_WORKSPACE/gradle.properties -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Gradle build-cache 共享
        # 4 个构建 job 跑在独立 runner 上, 按 (OS, 分支) 共享 build-cache 目录,
        # 减少各 job 重复编译 shared 等公共模块
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-

      - name: Build Release (原包名)
        run: |
          echo "统一版本号"
          # app/build.gradle.kts 已迁移为 kts, 锚定声明行 val version = "3.${releaseTime()}"
          sed "/^val version = /c val version = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle.kts  -i
          echo "开始${{ env.product }}原包名构建"
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all
          echo "收集APK"
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }}/app/build/outputs/renamed-apks -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      - name: Release Note & Tag
        if: github.event_name != 'pull_request'
        run: |
          echo "## 更新日志" > RELEASE_NOTES.md
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "⚠️ **注意：当前分支为 ${{ github.ref_name }}，包含实验性功能，可能有破坏性变更。**" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi
          if [ "${{ github.event_name }}" == "push" ]; then
            git log ${{ github.event.before }}..${{ github.event.after }} --pretty=format:"- %<(72,trunc)%s (%h)" | head -20 >> RELEASE_NOTES.md
          else
            git log -10 --pretty=format:"- %<(72,trunc)%s (%h)" >> RELEASE_NOTES.md
          fi

      # 发布逻辑已移入 publish-release job (等所有构建完成统一发布), 这里只把更新日志传上去
      - name: Upload Release Notes
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Post (原包名) to Telegram
        # 时序在共存构建前: 此时 apk/ 仅含原包名产物, 通配不会带出共存包
        if: github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes'
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHANNEL_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          context: |
            #阅读 #Legado #Beta ${{ env.VERSION }} (原包名)
            ${{ github.ref_name != 'master' && format('⚠️ 实验性分支: {0}', github.ref_name) || '' }}
          path: apk/*.apk
          method: sendFile

      # --- 接着编译共存版 ---
      - name: Build ReleaseA (共存)
        run: |
          echo "修改applicationIdSuffix为共存版"
          # kts 双引号赋值; 精确锚整句, 避免误伤 if (applicationIdSuffix == ".releaseA") 判断行与 ".debug" 赋值
          sed 's|applicationIdSuffix = ".release"|applicationIdSuffix = ".releaseA"|' $GITHUB_WORKSPACE/app/build.gradle.kts  -i
          echo "开始${{ env.product }}共存构建"
          ./gradlew assemble${{ env.product }}release -PcoexistBuild=true --build-cache --parallel --daemon --warning-mode all
          echo "收集共存版APK"
          find ${{ github.workspace }}/app/build/outputs/renamed-apks -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      # 两个变体构建完后一次上传 (原包名 + 共存), 不再分两次
      - name: Upload Artifacts (原包名 + 共存)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.product }}.apk
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: ignore

      # beta release 的删除/发布已移入 publish-release job (等所有构建完成统一发布, 挂全部产物)
      # 合并原两次蓝奏上传为一次: 此时 apk/ 含两个变体全部产物
      - name: Upload To Lanzou (原包名 + 共存)
        if: github.event_name != 'pull_request' && needs.prepare.outputs.lanzou == 'yes'
        continue-on-error: true
        run: |
          python3 .github/scripts/lzy_web.py "${{ github.workspace }}/apk/" "${{ secrets.LANZOU_FOLDER_ID }}"
        env:
          ylogin: ${{ secrets.LANZOU_ID }}
          phpdisk_info: ${{ secrets.LANZOU_PSD }}

      - name: Post (共存) to Telegram
        if: github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes'
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHANNEL_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          context: |
            #阅读 #Legado #Beta ${{ env.VERSION }} (共存)
            ${{ github.ref_name != 'master' && format('⚠️ 实验性分支: {0}', github.ref_name) || '' }}
          path: apk/*releaseA*.apk
          method: sendFile

  # ===== 多端桌面产物 (与 Android build 并行) =====
  # Windows MSI: Windows runner 上 jpackage 调 WiX 打包
  desktop-build:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle build-cache 共享
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-
      - name: Unify Desktop packageVersion
        shell: bash
        run: |
          # VERSION 的 BUILD 段超 MSI 上限 (≤65535), 由 desktop/build.gradle.kts 的
          # msiSafeVersion 映射; deb/rpm/dmg 直接用原值
          sed "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts -i
      - name: Build Quickjs Native Lib (Windows .dll)
        # desktop 打包前需要 quickjs native 库 (liblegado_quickjs.dll) 落到 jvm/native 目录
        # Windows runner 自带 cmake + MSVC, 一般可成功; 失败时 continue-on-error, 让上层打包报错更明确
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Verify Quickjs Native Lib
        shell: bash
        # 上一步 continue-on-error, 静默失败会打出不含 legado_quickjs.dll 的包 (JS 引擎运行时才炸)
        run: test -f "$GITHUB_WORKSPACE/modules/quickjs/build/libs/jvm/native/legado_quickjs.dll"
      - name: Build MSI
        # release buildType: 官方 ProGuard 集成仅 release 链启用 (proguardReleaseJars), default 链不瘦身
        run: ./gradlew :desktop:packageReleaseMsi --build-cache --parallel --daemon --warning-mode all
      - name: Collect MSI
        shell: bash
        # 用 $GITHUB_WORKSPACE (环境变量) 而非 ${{ github.workspace }} (表达式): 后者在
        # Windows runner 上展开为反斜杠字面量 (D:\a\...), 被 bash 转义吞掉导致路径损坏
        # (曾报 find: 'D:alegadolegado/...': No such file or directory)。
        # 另外 CMP 的 jpackage 产物在 binaries/{buildType}/<type>/ 下 (官方 ProGuard 集成启用 release
        # buildType 后目录名带 classifier, 如 main-release/msi), 全目录 find 避免路径变化再踩坑。
        # release 产物统一命名: 平台_架构[.扩展名] (如 windows_x64.msi), 不带版本号;
        # 包内 packageVersion 仍注入实际版本, 应用内版本不受影响。
        run: |
          mkdir -p $GITHUB_WORKSPACE/msi/
          find $GITHUB_WORKSPACE/desktop/build/compose/binaries -name "*.msi" -exec mv {} $GITHUB_WORKSPACE/msi/windows_x64.msi \;
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop.msi
          path: msi/*.msi
          if-no-files-found: ignore
      # Windows 便携版 zip: 复用 createReleaseDistributable 产物 (packageReleaseMsi 上游), 仅打 zip 不经安装器
      - name: Build portable zip
        # packagePortableZip 仅 Windows 执行 (onlyIf), 依赖 createReleaseDistributable (release 链含 ProGuard 瘦身)
        run: ./gradlew :desktop:packagePortableZip --build-cache --parallel --daemon --warning-mode all
      - name: Collect portable zip
        shell: bash
        # 与 MSI 同命名规则: 平台_架构_特殊版本 (portable=便携版), 不带版本号
        run: |
          mkdir -p $GITHUB_WORKSPACE/portable/
          find $GITHUB_WORKSPACE/desktop/build/outputs/portable -name "legado-portable-windows-x64-*.zip" -exec mv {} $GITHUB_WORKSPACE/portable/windows_x64_portable.zip \;
      - name: Upload portable zip Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado-portable-windows-x64
          path: portable/*.zip
          if-no-files-found: ignore
          retention-days: 30

  # Linux DEB/RPM: Ubuntu runner 上 jpackage 调 dpkg-deb / rpmbuild
  linux-build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle build-cache 共享
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-
      - name: Install Linux packaging deps
        # jpackage 打 deb 需要 dpkg-deb, 打 rpm 需要 rpmbuild; ubuntu-latest 默认无 rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
      - name: Unify Desktop packageVersion
        run: |
          sed "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts -i
      - name: Build Quickjs Native Lib (Linux .so)
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Verify Quickjs Native Lib
        # 上一步 continue-on-error, 静默失败会打出不含 liblegado_quickjs.so 的包
        run: test -f "$GITHUB_WORKSPACE/modules/quickjs/build/libs/jvm/native/liblegado_quickjs.so"
      - name: Build DEB & RPM
        # release buildType: 官方 ProGuard 集成仅 release 链启用, default 链不瘦身
        run: ./gradlew :desktop:packageReleaseDeb :desktop:packageReleaseRpm --build-cache --parallel --daemon --warning-mode all
      - name: Collect Linux packages
        # 与 MSI 同命名规则: 平台_架构[.扩展名]; jpackage 内部架构名 (amd64/x86_64) 统一对外叫 x64
        run: |
          mkdir -p ${{ github.workspace }}/linux/
          find ${{ github.workspace }}/desktop/build/compose/binaries -name "*.deb" -exec mv {} ${{ github.workspace }}/linux/linux_x64.deb \;
          find ${{ github.workspace }}/desktop/build/compose/binaries -name "*.rpm" -exec mv {} ${{ github.workspace }}/linux/linux_x64.rpm \;
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop.linux
          path: |
            ${{ github.workspace }}/linux/*.deb
            ${{ github.workspace }}/linux/*.rpm
          if-no-files-found: ignore

  # ===== macOS DMG (与 Android build 并行) =====
  # iOS 编译/出包已迁出到独立的 .github/workflows/ios.yml (仅 workflow_dispatch 手动触发):
  # macOS runner 计费是 Linux 的 10 倍, iOS 链路不适合每次 push 都跑。
  macos-build:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle build-cache 共享
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-
      - name: Unify Desktop packageVersion
        # macOS 自带 BSD sed, -i 需要空字符串备份后缀 (与 GNU sed 语法不同)
        run: |
          sed -i '' "s|packageVersion = \".*\"|packageVersion = \"${{ env.VERSION }}\"|" $GITHUB_WORKSPACE/desktop/build.gradle.kts
      - name: Build Quickjs Native Lib (macOS .dylib)
        # desktop 打包前需要 quickjs native 库 (liblegado_quickjs.dylib) 落到 jvm/native 目录
        # macos-latest 自带 cmake + clang, 一般可成功; 失败时 continue-on-error, 让上层打包报错更明确
        run: ./gradlew :modules:quickjs:buildJvmNativeLib --warning-mode all
        continue-on-error: true
      - name: Verify Quickjs Native Lib
        # 上一步 continue-on-error, 静默失败会打出不含 legado_quickjs.dylib 的包
        run: test -f "$GITHUB_WORKSPACE/modules/quickjs/build/libs/jvm/native/legado_quickjs.dylib"
      - name: Build macOS DMG
        run: ./gradlew :desktop:packageDmg --build-cache --parallel --daemon --warning-mode all
      - name: Collect DMG
        # 与 MSI 同理: jpackage 产物在 binaries/{buildType}/<type>/ 下, 全目录 find
        # 与 MSI 同命名规则: 平台_架构[.扩展名]; jpackage 内部架构名 (aarch64) 统一对外叫 arm64
        run: |
          mkdir -p $GITHUB_WORKSPACE/dmg/
          find $GITHUB_WORKSPACE/desktop/build/compose/binaries -name "*.dmg" -exec mv {} $GITHUB_WORKSPACE/dmg/macos_arm64.dmg \;
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop.dmg
          path: dmg/*.dmg
          if-no-files-found: ignore

  # ===== 鸿蒙 HAP (CI 不构建, 仅本地; 2026-08-19 查证结论) =====
  # 决策: 维持本地构建, CI 不建鸿蒙 job。原因链如下 (均已实测查证):
  #   1. shared .so 需 CPF 工具链: fork 构件仅发布在 maven.eazytec-cloud.com (中国私有 Nexus),
  #      GitHub-hosted runner 实测不可达, :shared:link*SharedOhosArm64 无法在 CI 跑。
  #   2. HAP 打包需 HarmonyOS SDK: 华为云公开镜像 (repo.huaweicloud.com/harmonyos/ohpm/) 最高
  #      commandline-tools 5.1.0.840, 自带 SDK = HarmonyOS 5.1.0 (API 18) + hvigor 5.18.5,
  #      无 API 24 SDK 公开下载渠道 (DevEco Studio SDK Manager 的 SDK 无公开直链)。
  #      工程 targetSdkVersion 6.1.1(24) > API 18 (华为规则 targetSdkVersion ≤ compileSdkVersion),
  #      故参考 DandanLLab/mr build.yml 的华为云镜像方案也无法编译本工程。
  #   3. compatibleSdkVersion 5.0.0(12) 已是代码/依赖下限, 不可降: ArkTS 全部用 @kit.* 模块
  #      (API 12 引入) 且 CPF-KMP-CMP (@cpf-kmp-cmp/compose) 仅支持 API 12+。
  #      (@cpf-kmp-cmp/compose 在 ohpm.openharmony.cn 公开源, 依赖解析不受阻;
  #       真正卡点仅 ①CPF Kotlin/Native 工具链 ②API 24 SDK 两个。)
  #
  # 本地构建 HAP 步骤:
  #   1. 安装 DevEco Studio: https://developer.huawei.com/consumer/cn/deveco-studio/
  #   2. DevEco Studio SDK Manager 安装 HarmonyOS SDK 6.1.1 (API 24, 与工程 targetSdkVersion 匹配)
  #   3. 编译 shared .so 并拷入 entry/libs (root build.gradle.kts 的 stageOhosNativeLibraries
  #      一站式完成: link release .so + 拷贝 + 生成头文件):
  #        ./gradlew stageOhosNativeLibraries -PenableOhosTarget=true
  #      产物 shared/build/bin/ohosArm64/releaseShared/liblegado_shared.so → ohosApp/entry/libs/arm64-v8a/
  #   4. 配置签名 (二选一):
  #      a) 调试签名: DevEco Studio 自动生成临时调试证书, 直接 Build → Build Hap(s)/APP(s) 即可
  #      b) 发布签名: 在 ohosApp/build-profile.json5 的 signingConfigs 数组填入 material.storeFile/cert
  #   5. 命令行打包 (仓库未提交 hvigorw 包装脚本, 用 DevEco Studio 内置 hvigorw, 在 ohosApp/ 目录下):
  #        # Windows: "D:/soft/DevEco Studio/tools/hvigor/bin/hvigorw.bat" (路径按本机安装位置)
  #        # Linux/macOS: $DEVECO_HOME/tools/hvigor/bin/hvigorw
  #        hvigorw assembleHap --mode module -p product=default --no-daemon
  #   6. 产物路径:
  #      - 未签名: ohosApp/entry/build/default/outputs/default/entry-default-unsigned.hap
  #      - 已签名: ohosApp/entry/build/default/outputs/default/entry-default-signed.hap
  #
  # 如未来 CI 想跑 HAP: 需自托管 runner (可访问 eazytec + 预装 API 24 SDK 与签名材料),
  # 参考下面被注释的 ohos-hap 模板 (华为云镜像下载 commandline-tools 方案对 API 24 工程不适用).
  #
  # ohos-hap:
  #   needs: prepare
  #   runs-on: [self-hosted, harmonyos]   # 需自托管 runner, 预装 DevEco 命令行工具
  #   env:
  #     HOS_SDK_HOME: ${{ secrets.HOS_SDK_HOME }}
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: Build HAP
  #       working-directory: ohosApp/
  #       run: hvigorw assembleHap --mode module -p product=default --no-daemon
  #     - name: Upload HAP Artifact
  #       uses: actions/upload-artifact@v6
  #       with:
  #         name: ohos.hap
  #         path: ohosApp/entry/build/default/outputs/default/*.hap

  # ===== 统一发布 beta release (全部产物) =====
  # 等 Android + 三端 desktop 全部构建完成后一次性发布, 把 APK/MSI/portable zip/DEB/RPM/DMG
  # 全部挂到 beta release 附件。单发布者避免了多 job 并发写同一 release 的竞态 (already_exists)。
  publish-release:
    needs: [prepare, build, desktop-build, linux-build, macos-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 本 job 要删除/重建 beta Release, 必须显式提权 (仓库默认 token 只读)
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Delete Old Beta Release
        continue-on-error: true
        run: gh release delete beta -y --cleanup-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish Pre-Release (全产物)
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.prepare.outputs.version }}
          tag: "beta"
          bodyFile: artifacts/RELEASE_NOTES.md
          prerelease: true
          allowUpdates: true
          artifacts: "artifacts/*.apk,artifacts/*.msi,artifacts/*.zip,artifacts/*.deb,artifacts/*.rpm,artifacts/*.dmg"
