name: Sync quickjs-ng

# vendored 上游副本的同步 / 纯净度校验工具。
# 详见 shared/src/cinterop/quickjs-ng/README.md
#
# mode=verify : 只比对不修改, 确认没人绕过流程偷改源码 (可安全随时跑)
# mode=sync   : 拉取指定 ref 覆盖源码, 然后开 PR (绝不直推默认分支)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "上游 ref (tag / 分支 / commit sha)。默认 = 当前 pin 的 commit"
        required: true
        default: "5f2fb55994413afcaeec2942021cc93bfafd0f81"
      mode:
        description: "sync = 覆盖源码并开 PR; verify = 只比对不修改"
        required: true
        type: choice
        options:
          - verify
          - sync
        default: verify

permissions:
  contents: write
  pull-requests: write

env:
  VENDOR_DIR: shared/src/cinterop/quickjs-ng
  UPSTREAM: quickjs-ng/quickjs

jobs:
  sync:
    name: "${{ inputs.mode }} @ ${{ inputs.ref }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 只拉需要的文件, 不 clone 整个上游仓库 (上游带着 test262/fuzz/examples, 几十 MB)。
      # LICENSE 在清单里: vendored 第三方源码应随带上游许可证原件。
      - name: Resolve upstream ref
        id: resolve
        run: |
          set -euo pipefail
          REF='${{ inputs.ref }}'
          echo "请求的 ref: $REF"
          SHA=$(git ls-remote "https://github.com/$UPSTREAM.git" "$REF" | awk '{print $1}' | head -n1)
          if [ -z "$SHA" ]; then
            # 不是 tag/分支名, 当作 commit sha 直接用
            SHA="$REF"
            echo "ls-remote 未命中, 按 commit sha 处理: $SHA"
          else
            echo "解析为 commit: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### 上游 ref" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REF\` → \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build file list
        id: list
        run: |
          set -euo pipefail
          # 现有 vendored 文件 + LICENSE (当前缺失, 应补回)
          {
            find "$VENDOR_DIR" -maxdepth 1 -type f \
              \( -name '*.c' -o -name '*.h' -o -name '*.js' \) -printf '%f\n'
            echo LICENSE
          } | sort -u > /tmp/files.txt
          echo "同步清单 ($(wc -l < /tmp/files.txt) 个文件):"
          cat /tmp/files.txt

      - name: Download upstream files
        run: |
          set -euo pipefail
          SHA='${{ steps.resolve.outputs.sha }}'
          mkdir -p /tmp/upstream
          fail=0
          while read -r f; do
            url="https://raw.githubusercontent.com/$UPSTREAM/$SHA/$f"
            code=$(curl -sL -w '%{http_code}' -o "/tmp/upstream/$f" "$url" || echo 000)
            if [ "$code" = "200" ]; then
              printf '  [OK  %s] %-32s %s bytes\n' "$code" "$f" "$(stat -c%s "/tmp/upstream/$f")"
            else
              printf '  [FAIL %s] %-32s <上游该 ref 下不存在?>\n' "$code" "$f"
              rm -f "/tmp/upstream/$f"
              fail=1
            fi
          done < /tmp/files.txt
          if [ "$fail" = "1" ]; then
            echo "::warning::部分文件在上游该 ref 下不存在, 见上方 FAIL 行。可能是上游重命名/删除了文件, 需人工确认。"
          fi

      # 本仓库 core.autocrlf=true, Windows 工作树是 CRLF 但 committed blob 是 LF。
      # runner 上 checkout 出来就是 LF, 但仍统一归一化, 避免误报成"本地改动"。
      - name: Diff against vendored copy
        id: diff
        run: |
          set -uo pipefail
          changed=0
          {
            echo "### 逐文件比对结果"
            echo ""
            echo "| 文件 | 结果 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r f; do
            up="/tmp/upstream/$f"
            local_f="$VENDOR_DIR/$f"
            if [ ! -f "$up" ]; then
              echo "  [SKIP] $f  (未下载成功)"
              echo "| \`$f\` | ⚠️ 下载失败 |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ ! -f "$local_f" ]; then
              echo "  [MISSING-LOCAL] $f  (上游有, 本地缺 → 将新增)"
              echo "| \`$f\` | ➕ 本地缺失 |" >> "$GITHUB_STEP_SUMMARY"
              changed=1
              continue
            fi
            tr -d '\r' < "$local_f" > /tmp/a
            tr -d '\r' < "$up"      > /tmp/b
            if cmp -s /tmp/a /tmp/b; then
              echo "  [IDENTICAL] $f"
              echo "| \`$f\` | ✅ 一致 |" >> "$GITHUB_STEP_SUMMARY"
            else
              n=$(diff /tmp/a /tmp/b | grep -c '^[<>]' || true)
              nw=$(diff -w -B /tmp/a /tmp/b | grep -c '^[<>]' || true)
              if [ "$nw" = "0" ]; then
                echo "  [DIFF-WHITESPACE-ONLY] $f  ($n 行, 忽略空白后为 0 → 纯格式差异)"
                echo "| \`$f\` | 🟡 仅空白差异 ($n 行) |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "  [DIFF-SUBSTANTIVE] $f  ($n 行, 忽略空白后仍有 $nw 行 → 实质改动)"
                echo "| \`$f\` | 🔴 实质差异 ($nw 行) |" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "----- diff $f (前 80 行) -----"
              diff -u /tmp/a /tmp/b | head -n 80
              echo "----- end $f -----"
              changed=1
            fi
          done < /tmp/files.txt

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "汇总: changed=$changed"

      - name: Verify verdict
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.changed }}" = "0" ]; then
            echo "✅ vendored 副本与上游 ${{ steps.resolve.outputs.sha }} 完全一致, 无人偷改。"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **纯净**: 与上游完全一致。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔴 **存在差异**: 见上表与作业日志。要么 ref 选错了, 要么有人绕过流程改了源码。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::vendored 副本与上游 ${{ inputs.ref }} 不一致。若非有意升级, 说明有人直接改了 $VENDOR_DIR 下的源码 —— 定制必须走 cinterop/JNI wrapper 层或 patch 文件, 见该目录 README。"
            exit 1
          fi

      - name: Apply upstream files
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '1'
        run: |
          set -euo pipefail
          while read -r f; do
            [ -f "/tmp/upstream/$f" ] || continue
            cp "/tmp/upstream/$f" "$VENDOR_DIR/$f"
            echo "  [WROTE] $VENDOR_DIR/$f"
          done < /tmp/files.txt
          git status --porcelain "$VENDOR_DIR"

      - name: Create Pull Request
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "chore/sync-quickjs-ng-${{ inputs.ref }}"
          delete-branch: true
          add-paths: |
            ${{ env.VENDOR_DIR }}/*
          commit-message: "chore(quickjs): 同步 quickjs-ng 至 ${{ inputs.ref }}"
          title: "chore(quickjs): 同步 quickjs-ng 至 `${{ inputs.ref }}`"
          body: |
            由 `Sync quickjs-ng` 工作流自动生成。**合并前必须完成下方人工验证清单。**

            ## 同步坐标

            | 项 | 值 |
            | --- | --- |
            | 上游 | https://github.com/${{ env.UPSTREAM }} |
            | 请求 ref | `${{ inputs.ref }}` |
            | 解析到 commit | `${{ steps.resolve.outputs.sha }}` |

            > ⚠️ 别用 `quickjs.h` 的 `QJS_VERSION_*` 判定版本 —— 上游只在打 tag 时 bump,
            > master 快照会一直自称上一个版本号。以上面的 commit sha 为准。

            ## 逐文件 diff 摘要

            见本次运行的 **Job Summary** 表格（✅ 一致 / 🟡 仅空白 / 🔴 实质差异 / ➕ 新增），
            以及 `Diff against vendored copy` 步骤日志里每个文件的前 80 行 unified diff。

            ## 需人工验证：三端编译（CI 不覆盖 native 编译，必须本地跑）

            - [ ] **Android / JVM (JNI + CMake)** —
                  `./gradlew :modules:quickjs-android-native:externalNativeBuildAppDebug`
            - [ ] **Desktop / shared-jvm** — `./gradlew :shared:compileKotlinJvm`
            - [ ] **iOS**（需 macOS）— `bash scripts/build-ios-native.sh` 且
                  `./gradlew :shared:cinteropQuickjsIosArm64`
            - [ ] **鸿蒙**（需鸿蒙 SDK）— `./gradlew :shared:cinteropQuickjsLinuxArm64`

            ## 需人工审查

            - [ ] `shared/src/cinterop/quickjs.def` 的 `qjs_*` wrapper 是否被上游 API 签名变更打断
            - [ ] 是否新增 / 删除了 `.c` 文件 —— 若有，需同步修改 **5 处消费方**的源文件列表：
                  `modules/quickjs-android-native/src/main/cpp/CMakeLists.txt`、
                  `ohosApp/entry/src/main/cpp/CMakeLists.txt`、
                  `shared/src/cinterop/quickjs.def`、
                  `build-logic/src/ohos/kotlin/io/legado/buildlogic/OhosTargetConventionPlugin.kt`、
                  `scripts/build-ios-native.sh`
            - [ ] JS 引擎行为回归（书源解析 / bytecode 缓存兼容性）
            - [ ] 更新 `${{ env.VENDOR_DIR }}/README.md` 的「版本」表格 commit sha

      - name: Nothing to do
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '0'
        run: echo "vendored 副本已与 ${{ steps.resolve.outputs.sha }} 一致, 无需开 PR。"
