plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.serialization
    alias libs.plugins.compose.compiler
    // K5-c Phase 5: @Database 已下沉 shared/commonMain, room 插件移至 shared 模块
    // alias libs.plugins.room
    alias libs.plugins.ksp
}
static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = Integer.parseInt('git rev-list HEAD --count'.execute().text.trim())

// K5-c Phase 5: @Database 已下沉 shared/commonMain, room schema 由 shared 模块生成
// room { schemaDirectory "$projectDir/schemas" }

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "shutiao.reader"
        minSdk 26
        targetSdk 36
        versionCode 10000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        def cronetVersion = libs.versions.cronet.get()
        def cronetMainVersion = cronetVersion.substring(0, cronetVersion.indexOf('.')) + ".0.0.0"
        buildConfigField "String", "Cronet_Version", "\"$cronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$cronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    androidResources {
        localeFilters += ["en", "zh", "zh-rHK", "zh-rTW"]
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            } else {
                signingConfig signingConfigs.debug
            }
            vcsInfo {
                include = false
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abi = output.getFilter("ABI")
            // 简写架构名称
            def abiShortMap = [
                    "arm64-v8a"  : "arm64",
                    "armeabi-v7a": "armv7",
                    "x86_64"     : "x64",
                    "x86"        : "x86",
                    "all"       : "all"
            ]
            def abiName = abiShortMap.get(abi ?: "all")
            def suffix = ''
            if (variant.buildType.name == 'release') {
                suffix = variant.buildType.applicationIdSuffix == '.releaseA' ? '_releaseA' : ''
            }
            outputFileName = "${abiName}${suffix}.apk"
        }
    }


    // KSP 参数
    ksp {
        // K5-c Phase 5: Room KSP 已移至 shared 模块, room.* arg 不再需要
        // arg("room.incremental", "true")
        // arg("room.expandProjection", "true")
        // arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")
        // BaseSource 已下沉 shared，@JsApi 分派表仍由 app 侧 KSP 从 classpath 解析生成
        arg("jsapi.extraClasses", "io.legado.app.data.entities.BaseSource")
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
        resources.excludes.add('META-INF/androidx/**')
        resources.excludes.add('META-INF/jsoup/**')
        resources.excludes.add('META-INF/native-image/**')
        resources.excludes.add('google/protobuf/**')
        resources.excludes.add('kotlin/**')
        resources.excludes.add('META-INF/versions/**')
        resources.excludes.add('tc/*')
        jniLibs.excludes.add('lib/*/libcronet*.so')
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
        // vi/pt-rBR/ja-rJP/es-rES 不在 localeFilters 中(APK 不打包),
        // 保留翻译源文件备用但不强制要求翻译完整性
        // NewerVersionAvailable/GradleDependency: 依赖版本升级需充分回归测试,不属 lint 修复范畴
        disable 'MissingTranslation', 'NewerVersionAvailable', 'GradleDependency'
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
}

// 从 shared/jvmMain/resources/web 同步到 app/src/main/assets/web（单一数据源）
tasks.register('copyWebResources', Copy) {
    from "${rootProject.projectDir}/shared/src/jvmMain/resources/web"
    into "${projectDir}/src/main/assets/web"
}
preBuild.dependsOn('copyWebResources')

dependencies {
    coreLibraryDesugaring(libs.desugar)
    testImplementation(libs.junit)
    androidTestImplementation(libs.bundles.androidTest)

    implementation(libs.kotlin.stdlib)

    implementation(libs.bundles.coroutines)
    // KJ3 并发原语下沉前置：atomicfu locks 门面(commonMain-ready synchronized)
    implementation(libs.kotlinx.atomicfu)

    implementation(libs.core.ktx)
    implementation(libs.appcompat.appcompat)
    implementation(libs.activity.ktx)
    implementation(libs.fragment.ktx)

    //compose：BOM 统一版本，platform 引入
    implementation(platform(libs.compose.bom))
