# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Bugs: This will override important JVM argument defaults. Include all important JVM arguments if you wan to change arguments. See https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-XX:+UseParallelGC -Xmx10g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# kotlin.incremental.useClasspathSnapshot=true
android.enableResourceOptimizations=true
android.enableR8.fullMode=true
# Pre-adopt AGP 9 defaults while still building with AGP 8.13.
# Keep these explicit until the dependency/toolchain upgrade lands, so incompatible
# build logic fails now instead of being hidden behind AGP 9 opt-out flags.
android.newDsl=true
# AGP 8.13.2 built-in Kotlin currently fails in CheckClasspathTask because AGP's
# compileVersionMap entries are not serializable. Keep the app on kotlin-android
# until the AGP upgrade fixes that toolchain bug; no AGP 9 opt-out is added.
android.uniquePackageNames=true
android.default.androidx.test.runner=true
# Keep AGP 8.13 dependency constraints enabled. Its AGP 9 default (`false`) triggers
# CheckClasspathTask's non-serializable compileVersionMap bug on this toolchain.
android.dependency.useConstraints=true
# 以下 4 项均为 AGP 9 默认值, 曾以 fail-fast 目的显式开启 (AGP 8.13 下报 experimental 警告),
# 项目已多次编译通过、行为正常, 故删除。升级到 AGP 9 后自动生效, 无需再关注:
#   android.enableAppCompileTimeRClass=true
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
#   android.proguard.failOnMissingFiles=true
#   android.r8.optimizedResourceShrinking=true
android.onlyEnableUnitTestForTheTestedBuildType=true
android.r8.strictFullModeForKeepRules=true
android.r8.proguardAndroidTxt.disallowed=true
android.r8.globalOptionsInConsumerRules.disallowed=true
android.sourceset.disallowProvider=true
android.custom.shader.path.required=true
# https://blog.gradle.org/introducing-file-system-watching
# 曾因文件系统 watcher 漏掉 IDE 对 strings.xml 的保存事件 (daemon 日志里该时刻无 VFS change
# 事件, 其他同刻保存的文件都有), 导致 convertXmlValueResources 一直按旧快照判 UP-TO-DATE,
# compose 资源访问器不重新生成、编译报 Unresolved reference。
# 2026-08-04: 此修复已撤销——VFS watch 与增量编译恢复默认(偶发, 不为偶发牺牲性能)。
# enable cache can not up app version
org.gradle.unsafe.configuration-cache=false
# AGP 9 removes the global buildFeatures properties. Features stay disabled by
# default and must be enabled only in the Android module that actually uses them.
# enables namespacing of each library's R class so that its R class includes only the resources declared in the library itself
# and none from the library's dependencies, thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true
# https://chromiumdash.appspot.com/releases?platform=Android
android.injected.testOnly=false
android.nonFinalResIds=true
android.injected.androidTest.leaveApksInstalledAfterRun=true
# 启用 cinterop commonization, 让 iosArm64/iosSimulatorArm64 共享 cinterop 绑定 (quickjs)
kotlin.mpp.enableCInteropCommonization=true
# :shared 与 :modules:quickjs 的源集层级在 build 脚本里手工搭建 (sharedUiMain/nonOhosUiMain/
# skikoUiMain 等自定义源集, 显式 dependsOn), 关闭默认 Hierarchy Template 使该行为显式化,
# 消除 "Default Kotlin Hierarchy Template Not Applied" 警告 (与当前生效的回退行为一致)。
kotlin.mpp.applyDefaultHierarchyTemplate=false
# AGP 9 移除了 CommonExtension.experimentalProperties DSL, self-instrumenting 改由此键启用;
# 项目 android.newDsl=true 已预采 AGP 9 行为, :benchmark (com.android.test) 依赖此键。
android.experimental.self-instrumenting=true
# CPF-KMP-CMP 0.4.0 使用配套 Kotlin/Native，不再混用官方 Konan 版本。
# 鸿蒙应用固定使用 ArkUI 融合渲染；应用工程不允许 rendererBackend=both。
rendererBackend=fusion-renderer
# compileSdk 37 高于 AGP 8.13.2 推荐上限 36 (markdown-renderer 0.42+/0.43 要求 37):
# AGP 对此仅发 warning, 官方压制属性 (AGP 9 起该上限同步到 37, 届时可移除)。
android.suppressUnsupportedCompileSdk=37
