# XcodeGen 配置文件 - 生成 iosApp.xcodeproj
#
# 用法 (macOS):
#   brew install xcodegen
#   cd iosApp
#   xcodegen generate
#
# XcodeGen 优势:
# - project.yml 是纯文本, 可 git 跟踪, 避免二进制 .xcodeproj 冲突
# - 团队协作时每人本地生成 .xcodeproj, 无需 merge 冲突
# - 配置变更后重新 generate 即可, 无需手动 Xcode 操作
#
# 工程配置:
# - iOS 14.0+ (SwiftUI App 生命周期 @main 要求)
# - Swift 5.9
# - 依赖 shared framework (Kotlin Multiplatform 产出)

name: iosApp
options:
  bundleIdPrefix: io.legado.app
  deploymentTarget:
    iOS: "14.0"
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # 团队 ID (Apple Developer 账号, 留空用 Personal Team)
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "README.md"
          - "*.xcodeproj"
          - "build"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: legado
        # legado:// / yuedu:// deep link (一键导入书源/替换规则/主题等),
        # 对照 app 端 AndroidManifest AssociationActivity intent-filter (scheme legado/yuedu)。
        # 回调链: SwiftUI onOpenURL (iOSApp.swift) → shared framework
        # LegadoDeepLinkIosKt.handleLegadoDeepLink → commonMain LegadoDeepLinkHandler
        CFBundleURLTypes:
          - CFBundleURLName: io.legado.app.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - legado
              - yuedu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.app.ios
        PRODUCT_NAME: legado
        # Kotlin 官方 direct integration 将当前 SDK/架构/构建类型对应的 framework
        # 复制到 TARGET_BUILD_DIR 并签名，不再硬编码 shared/build/bin 下的变体路径。
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "-framework"
          - "shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - script: |
          #!/bin/bash
          set -e
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle framework build because the IDE already built it."
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --stacktrace
        name: Embed and sign shared framework
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: []
      gatherCoverageData: false
